<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>重设密码｜学习计划</title>
  <link rel="stylesheet" href="auth-pages.css">
</head>
<body>
  <main class="auth-card">
    <div class="auth-logo">计</div>
    <h1>重设密码</h1>
    <p>请设置新的登录密码。保存后需要使用新密码重新登录。</p>
    <div class="status" id="status" role="status" aria-live="polite">正在验证重设链接……</div>
    <form id="resetForm" hidden>
      <label>新密码<input id="newPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="至少 8 个字符"></label>
      <label>确认新密码<input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required placeholder="再次输入新密码"></label>
      <button id="submitBtn" type="submit">保存新密码</button>
    </form>
    <div class="actions"><a class="button secondary" href="./">返回学习计划</a></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (()=>{
      "use strict";
      const URL="https://dkaoagflpimnpovuvuhk.supabase.co";
      const KEY="sb_publishable_lC-29jF4VXPw1HADXTUgGA_FTxwpEkB";
      const initialSearch=new URLSearchParams(location.search),initialHash=new URLSearchParams(location.hash.slice(1));
      const hasRecoveryHint=initialSearch.has("code")||initialHash.get("type")==="recovery";
      const client=window.supabase?.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
      const form=document.querySelector("#resetForm"),status=document.querySelector("#status"),button=document.querySelector("#submitBtn");
      let ready=false;
      function setStatus(message,type=""){status.textContent=message;status.className=`status ${type}`.trim()}
      function enable(){if(ready)return;ready=true;form.hidden=false;setStatus("链接验证成功，请输入新密码。","success");history.replaceState({},document.title,location.pathname)}
      async function init(){
        const linkError=initialSearch.get("error_description")||initialHash.get("error_description");
        if(linkError)return setStatus(linkError,"error");
        if(!hasRecoveryHint)return setStatus("当前页面没有有效的密码重设信息，请从登录页面重新申请。","error");
        if(!client)return setStatus("验证组件没有加载成功，请检查网络后重试。","error");
        client.auth.onAuthStateChange((event,session)=>{if(session&&(event==="PASSWORD_RECOVERY"||hasRecoveryHint&&(event==="SIGNED_IN"||event==="INITIAL_SESSION")))enable()});
        const {data,error}=await client.auth.getSession();
        if(error)return setStatus(error.message,"error");
        if(data.session)enable();else setTimeout(()=>{if(!ready)setStatus("重设链接无效或已经过期，请回到登录页面重新申请。","error")},5000);
      }
      form.addEventListener("submit",async event=>{
        event.preventDefault();const password=document.querySelector("#newPassword").value,confirm=document.querySelector("#confirmPassword").value;
        if(password.length<8)return setStatus("密码至少需要 8 个字符。","error");
        if(password!==confirm)return setStatus("两次输入的密码不一致。","error");
        button.disabled=true;setStatus("正在保存新密码……");
        const {error}=await client.auth.updateUser({password});
        if(error){button.disabled=false;return setStatus(`保存失败：${error.message}`,"error")}
        await client.auth.signOut();form.hidden=true;setStatus("密码已经更新，请返回学习计划并使用新密码登录。","success");
      });
      init();
    })();
  </script>
</body>
</html>
